name: Get Citation Data

on:
  page_build:
  schedule:
    # Avoid the top of the hour, when scheduled Actions runs are most delayed.
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r google_scholar_crawler/requirements.txt

    - name: Run crawler tests
      run: |
        python -m unittest discover -s tests -v

    - name: Fetch citation data
      id: crawl
      continue-on-error: true
      timeout-minutes: 5
      working-directory: google_scholar_crawler
      run: |
        python main.py
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

    - name: Preserve last successful citation data
      if: steps.crawl.outcome == 'failure'
      run: |
        echo "::warning::Citation fetch was blocked or timed out; keeping the last successful data."

    - name: Publish citation data
      if: steps.crawl.outcome == 'success'
      env:
        GIT_INDEX_FILE: ${{ runner.temp }}/google-scholar-stats.index
      run: |
        set -euo pipefail
        deploy_dir="${RUNNER_TEMP}/google-scholar-stats"
        mkdir -p "${deploy_dir}"
        cp google_scholar_crawler/results/*.json "${deploy_dir}/"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git --work-tree="${deploy_dir}" read-tree --empty
        git --work-tree="${deploy_dir}" add gs_data.json gs_data_shieldsio.json
        tree="$(git write-tree)"
        commit="$(printf '%s\n' 'Updated Citation Data' | git commit-tree "${tree}")"
        git push --force origin "${commit}:refs/heads/google-scholar-stats"
