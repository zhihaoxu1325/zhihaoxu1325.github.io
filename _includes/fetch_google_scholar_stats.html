<script src="{{ '/assets/js/google-scholar-stats.js' | relative_url }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/';
        {% endif %}
        window.GoogleScholarStats.loadGoogleScholarStats(
            gsDataBaseUrl + 'google-scholar-stats/gs_data.json'
        );
    });
</script>
